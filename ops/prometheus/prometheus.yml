global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - {names: [api], type: A, port: 8000, refresh_interval: 5s}
  - job_name: gateway
    dns_sd_configs:
      - {names: [gateway], type: A, port: 8000, refresh_interval: 5s}
  - job_name: processor
    dns_sd_configs:
      - {names: [processor], type: A, port: 9100, refresh_interval: 5s}
  - job_name: edge
    static_configs:
      - targets: [edge:8404]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: nats
    static_configs:
      - targets: [nats-exporter:7777]
