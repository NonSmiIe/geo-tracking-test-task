rule_files:
  - rules.yml

evaluation_interval: 15s

tests:
  - name: a processor outage past 30 minutes of ingest pages
    interval: 15s
    input_series:
      - series: fleet_ingest_reports_total{outcome="accepted", instance="api-1"}
        values: 0+15000x60
      - series: kafka_consumergroup_lag{consumergroup="processors", topic="reports", partition="0"}
        values: 0+50000x60
    alert_rule_test:
      - eval_time: 4m
        alertname: RetentionAtRisk
      - eval_time: 12m
        alertname: RetentionAtRisk
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Consumer lag is past 30 min of ingest; the 1 GiB-per-partition cap can delete acked reports unread.

  - name: a keeping-up pipeline raises nothing
    interval: 15s
    input_series:
      - series: fleet_ingest_reports_total{outcome="accepted", instance="api-1"}
        values: 0+15000x40
      - series: kafka_consumergroup_lag{consumergroup="processors", topic="reports", partition="0"}
        values: 500x40
      - series: fleet_processor_partitions{instance="p1"}
        values: 12x40
      - series: fleet_processor_partitions{instance="p2"}
        values: 12x40
      - series: kafka_topic_partitions{topic="reports"}
        values: 24x40
    alert_rule_test:
      - {eval_time: 10m, alertname: RetentionAtRisk}
      - {eval_time: 10m, alertname: ConsumerLagGrowing}
      - {eval_time: 10m, alertname: PartitionsUnowned}

  - name: a dead processor leaves partitions unowned
    interval: 30s
    input_series:
      - series: fleet_processor_partitions{instance="p1"}
        values: 12x6
      - series: kafka_topic_partitions{topic="reports"}
        values: 24x6
    alert_rule_test:
      - eval_time: 2m
        alertname: PartitionsUnowned
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Some partitions have no processor; their devices are frozen.

  - name: refusing more than one report in a hundred is shedding
    interval: 15s
    input_series:
      - series: fleet_ingest_reports_total{transport="http", outcome="accepted", instance="api-1"}
        values: 0+1500x20
      - series: fleet_ingest_reports_total{transport="http", outcome="overloaded", instance="api-1"}
        values: 0+150x20
    alert_rule_test:
      - eval_time: 4m
        alertname: IngestShedding
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Over 1% of reports are refused with 503.

  - name: socket traffic does not dilute HTTP shedding
    interval: 15s
    input_series:
      - series: fleet_ingest_reports_total{transport="ws", outcome="accepted", instance="api-1"}
        values: 0+1000000x20
      - series: fleet_ingest_reports_total{transport="http", outcome="accepted", instance="api-1"}
        values: 0+1500x20
      - series: fleet_ingest_reports_total{transport="http", outcome="overloaded", instance="api-1"}
        values: 0+150x20
    alert_rule_test:
      - eval_time: 4m
        alertname: IngestShedding
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Over 1% of reports are refused with 503.

  - name: lag that keeps growing warns before retention is at risk
    interval: 30s
    input_series:
      - series: kafka_consumergroup_lag{consumergroup="processors", topic="reports", partition="0"}
        values: 20000+2000x30
    alert_rule_test:
      - eval_time: 12m
        alertname: ConsumerLagGrowing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Processors are committing slower than ingest accepts.

  - name: slow freshness, a full window, failing batches, evictions and drops
    interval: 15s
    input_series:
      - series: fleet_processor_freshness_seconds_bucket{le="1", instance="p1"}
        values: 0+1x40
      - series: fleet_processor_freshness_seconds_bucket{le="5", instance="p1"}
        values: 0+100x40
      - series: fleet_processor_freshness_seconds_bucket{le="+Inf", instance="p1"}
        values: 0+100x40
      - series: fleet_ingest_window_used{instance="api-1"}
        values: 900x40
      - series: fleet_ingest_window_size{instance="api-1"}
        values: 1000x40
      - series: fleet_processor_batches_total{outcome="failed", instance="p1"}
        values: 0+1x40
      - series: fleet_gateway_evictions_total{reason="backlog_overflow", instance="g1"}
        values: 0+1x40
      - series: fleet_gateway_slow_consumers_total{instance="g1"}
        values: 0+1x40
    alert_rule_test:
      - eval_time: 5m
        alertname: FreshnessSlow
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: p95 time from report to commit is over 1 s.
      - eval_time: 5m
        alertname: IngestWindowSaturated
        exp_alerts:
          - exp_labels: {severity: warning, instance: api-1}
            exp_annotations:
              summary: "api-1 keeps its produce window over 80% full; Kafka acks are slow."
      - eval_time: 5m
        alertname: BatchesFailing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Processor batches are rolling back and replaying.
      - eval_time: 5m
        alertname: DashboardsEvicted
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Gateways closed dashboards that could not keep up.
      - eval_time: 5m
        alertname: GatewaySlowConsumer
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: NATS dropped messages for a gateway subscription; its dashboards were told to resync.

  - name: a blocked loop and a dead target
    interval: 15s
    input_series:
      - series: fleet_event_loop_lag_seconds_bucket{job="api", le="0.25", instance="api-1"}
        values: 0+1x40
      - series: fleet_event_loop_lag_seconds_bucket{job="api", le="1", instance="api-1"}
        values: 0+10x40
      - series: fleet_event_loop_lag_seconds_bucket{job="api", le="+Inf", instance="api-1"}
        values: 0+10x40
      - series: up{job="gateway", instance="g1"}
        values: 0x40
    alert_rule_test:
      - eval_time: 5m
        alertname: EventLoopLag
        exp_alerts:
          - exp_labels: {severity: warning, job: api}
            exp_annotations:
              summary: "api event loops are blocked for over 250 ms at p99."
      - eval_time: 5m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: critical, job: gateway, instance: g1}
            exp_annotations:
              summary: "gateway g1 is not answering scrapes."
