name: geo-tracking-test-task
x-infra: &infra
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
x-app: &app
  <<: *infra
  build: {context: ., target: runtime}
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  init: true
  stop_grace_period: 45s
  mem_limit: 256m
  cpus: 1
  environment: &env
    GEO_DATABASE_URL: postgresql+asyncpg://fleet_app:${APP_DATABASE_PASSWORD:-local-demo-password}@db:5432/geo
    GEO_KAFKA_BOOTSTRAP: kafka:9092
    GEO_NATS_SERVERS: nats://${NATS_TOKEN:-local-demo-token}@nats:4222
    PROMETHEUS_DISABLE_CREATED_SERIES: "true"
services:
  db:
    <<: *infra
    build:
      context: .
      dockerfile: Dockerfile.postgis
    command:
      [postgres, -c, shared_buffers=512MB, -c, effective_cache_size=1GB, -c, max_connections=200,
       -c, shared_preload_libraries=pg_stat_statements, -c, track_io_timing=on]
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U geo -d geo"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 1536m
    cpus: 3
  kafka:
    <<: *infra
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_MS: 86400000
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_HEAP_OPTS: -Xms768m -Xmx768m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    mem_limit: 1536m
    cpus: 2
  nats:
    <<: *infra
    image: nats:2.11.9-alpine
    command: [-m, "8222", --auth, "${NATS_TOKEN:-local-demo-token}"]
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:8222/healthz]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 256m
    cpus: 1
  migrate:
    <<: *app
    restart: "no"
    entrypoint: [alembic, upgrade, head]
    environment:
      <<: *env
      GEO_DATABASE_URL: postgresql+asyncpg://geo:${POSTGRES_PASSWORD:-local-demo-password}@db:5432/geo
      FLEET_APP_PASSWORD: ${APP_DATABASE_PASSWORD:-local-demo-password}
    depends_on:
      db:
        condition: service_healthy
  edge:
    <<: *infra
    image: haproxy:3.2-alpine
    volumes:
      - ./edge/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8097}:8000"
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
    mem_limit: 256m
    cpus: 2
  api:
    <<: *app
    depends_on: &ready
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck: &health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    deploy:
      replicas: ${API_REPLICAS:-4}
    mem_limit: 320m
    cpus: 1
  loadgen:
    <<: *app
    command: [geo_tracking.loadgen:app]
    healthcheck: *health
    mem_limit: 1g
    cpus: 4
  gateway:
    <<: *app
    command: [--ws-max-size, "4096", geo_tracking.gateway_app:app]
    depends_on:
      nats:
        condition: service_healthy
    healthcheck: *health
    deploy:
      replicas: ${GATEWAYS:-2}
    mem_limit: 320m
    cpus: 1
  processor:
    <<: *app
    entrypoint: [python, -m, geo_tracking.processor]
    depends_on: *ready
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health/live', timeout=3)"]
    deploy:
      replicas: ${PROCESSORS:-8}
    mem_limit: 384m
    cpus: 1
  prometheus:
    <<: *infra
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2d]
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9097}:9090"
    mem_limit: 768m
    cpus: 1
  grafana:
    <<: *infra
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleetline.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3097}:3000"
    depends_on: [prometheus]
    mem_limit: 256m
    cpus: 1
  kafka-exporter:
    <<: *infra
    image: danielqsj/kafka-exporter:v1.9.0
    command: [--kafka.server=kafka:9092]
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
  postgres-exporter:
    <<: *infra
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    command: [--collector.stat_statements]
    environment:
      DATA_SOURCE_URI: db:5432/geo?sslmode=disable
      DATA_SOURCE_USER: fleet_monitor
      DATA_SOURCE_PASS: ${APP_DATABASE_PASSWORD:-local-demo-password}
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    cpus: 0.5
  nats-exporter:
    <<: *infra
    image: natsio/prometheus-nats-exporter:0.17.3
    command: [-varz, -connz, -subz, http://nats:8222]
    depends_on:
      nats:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.5
  tests:
    security_opt: [no-new-privileges:true]
    build: {context: ., target: test}
    profiles: [test]
    environment:
      <<: *env
      GEO_DATABASE_URL: postgresql+asyncpg://geo:${POSTGRES_PASSWORD:-local-demo-password}@db:5432/geo_test
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nats:
        condition: service_healthy
    command: [sh, -c, "python -m scripts.create_test_database && alembic upgrade head && python -m pytest -q"]
volumes:
  pgdata:
  kafkadata:
  promdata:
