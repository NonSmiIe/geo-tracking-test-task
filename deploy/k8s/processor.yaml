apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
spec:
  selector:
    matchLabels: {app: processor}
  template:
    metadata:
      labels: {app: processor}
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: processor
          image: fleetline
          command: [python, -m, geo_tracking.processor]
          ports:
            - {name: metrics, containerPort: 9100}
          envFrom:
            - configMapRef: {name: fleetline}
            - secretRef: {name: fleetline-database}
          livenessProbe:
            httpGet: {path: /health/live, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 384Mi}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: processor
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: processor}
---
apiVersion: v1
kind: Service
metadata:
  name: processor-metrics
  labels: {app: processor}
spec:
  clusterIP: None
  selector: {app: processor}
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: processor
spec:
  scaleTargetRef: {name: processor}
  minReplicaCount: 2
  maxReplicaCount: 64
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - {type: Percent, value: 100, periodSeconds: 30}
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - {type: Pods, value: 2, periodSeconds: 60}
  triggers:
    - type: kafka
      metadata:
        bootstrapServersFromEnv: GEO_KAFKA_BOOTSTRAP
        consumerGroupFromEnv: GEO_KAFKA_GROUP
        topicFromEnv: GEO_KAFKA_TOPIC
        lagThreshold: "20000"
        offsetResetPolicy: earliest
        allowIdleConsumers: "false"
