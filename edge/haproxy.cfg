global
    maxconn 20000
    log stdout format raw local0
    tune.sndbuf.client 131072
    tune.rcvbuf.server 131072

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode http
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h
    timeout http-request 10s
    timeout http-keep-alive 5s
    option http-server-close
    retries 3
    option redispatch 1
    timeout check 5s
    default-server inter 2s fall 3 rise 2 maxconn 4096

frontend fleetline
    bind :8000
    log global
    log-format '{"ts":"%tr","role":"edge","request_id":"%[var(txn.request_id)]","method":"%HM","path":"%[var(txn.path),json(utf8s)]","status":%ST,"ms":%Ta,"backend":"%b","server":"%s","termination":"%ts"}'
    unique-id-format %[uuid()]
    http-request set-header X-Request-ID %[unique-id] unless { req.hdr(x-request-id) -m reg ^[A-Za-z0-9._-]{1,128}$ }
    http-request set-var(txn.request_id) req.hdr(x-request-id)
    http-request set-var(txn.path) path
    http-after-response set-header X-Request-ID %[var(txn.request_id)]
    http-request deny deny_status 404 if { path /metrics }
    http-request set-var(txn.user) req.hdr(x-user-id) if { req.hdr(x-user-id) -m found }
    http-request set-var(txn.user) url_param(user_id) if { path /ws } { url_param(user_id) -m found }
    http-request track-sc0 var(txn.user) table per_user if { var(txn.user) -m found }
    http-request deny deny_status 429 if { sc0_http_req_rate(per_user) gt 600 }
    http-request deny deny_status 429 if { path /ws } { sc0_conn_cur(per_user) gt 16 }
    acl dashboard path_beg /ws
    use_backend gateway if dashboard
    use_backend loadgen if { path_beg /loadgen }
    default_backend api

backend per_user
    stick-table type string len 96 size 100k expire 10m store http_req_rate(10s),conn_cur

frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }

backend api
    balance leastconn
    option httpchk GET /health/live
    server-template api 64 api:8000 check resolvers docker init-addr none

backend gateway
    balance leastconn
    option httpchk GET /health/live
    server-template gateway 64 gateway:8000 check resolvers docker init-addr none

backend loadgen
    option httpchk GET /health/live
    server loadgen loadgen:8000 check resolvers docker init-addr none
